blank_issues_enabled: false
contact_links:
  - name: "A problem with one plugin"
    url: https://github.com/orgs/Bespok3d/repositories
    about: "Open it on that plugin's own repository."
  - name: "Adding (enrolling) a printer, or a new printer"
    url: https://github.com/Bespok3d/adapters/issues/new/choose
    about: "Printer support lives in the adapters."
  - name: "An idea for a new plugin"
    url: https://github.com/Bespok3d/main-index/issues/new/choose
    about: "New plugin requests go to the main index."
  - name: "A security problem"
    url: https://github.com/Bespok3d/Bespok3d-desktop/security/policy
    about: "Report it privately, the way the security policy says. Do not open a public issue."
