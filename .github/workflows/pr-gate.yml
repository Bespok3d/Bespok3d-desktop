name: pr-gate

# Every pull request and every push to dev or main runs the app's own gate, so nothing reaches a
# release branch without the check you run locally. The app's check.sh reuses the shared detectors that
# live in lib_bespok3d, so that sibling is checked out beside the app at the path check.sh expects
# (../lib_bespok3d). check.sh installs the app's own node_modules itself.
#
# lib_bespok3d is public, so that checkout carries no token. A token here would break every fork pull
# request, because a fork receives an empty secrets context and the checkout would die before the
# contributor's code is read.
on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Bespok3d-desktop
      - uses: actions/checkout@v4
        with:
          repository: Bespok3d/lib_bespok3d
          # Pinned to a commit, not a branch: the shared-tooling checkout must be immutable or whoever
          # can push to lib_bespok3d changes what this gate executes. Bump this SHA when the shared
          # detectors move. The workflow-pinning guard fails the gate on any non-40-hex ref here.
          ref: 94724bda4ce0fc13438460601a7177ec194bd12a
          path: lib_bespok3d
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # check.sh runs the per-file licence check through `reuse`, which is not on the runner image.
      # Without it the check reports itself as skipped, so a file naming a licence whose text is
      # missing from LICENSES/ would reach main unnoticed. pipx rather than pip because this job has
      # no setup-python step and the image's system python refuses a direct install. The
      # charset-normalizer extra is not optional: reuse aborts on start without an encoding backend.
      - name: Install the REUSE licence linter
        run: pipx install 'reuse[charset-normalizer]'

      - name: Run the gate
        working-directory: Bespok3d-desktop
        run: bash scripts/check.sh
